name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # 测试与验收一律离线跑 MockBackend，不需要任何 API key
  BOTC_BACKEND: mock

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # 防止嵌套验收脚本（内部串行子进程）拖垮 CI；默认 6h 上限过宽，
    # 收紧到 25min：快速单测 + 静态检查足以在限内完成。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

      - name: Pytest
        # 排除 slow 验收包装测试（subprocess 运行完整验收脚本，单测过慢）；
        # 验收覆盖由 scripts/acceptance/*.py 与 alpha1.1 聚合脚本单独执行。
        # faulthandler_timeout=120：任一测试挂起 120s 即 dump 线程栈并中断，
        # 防止单测偶发挂起拖垮整个 job（本 repo 历史上有 1h58m 卡死先例）。
        run: pytest tests -q -m "not slow" -o faulthandler_timeout=120

      - name: Doc health
        # 文档门禁：frontmatter 完整性 + 相对链接健康（scripts/check_doc_health.py）。
        # 绝对/非便携路径链接为告警（--strict 才升级为失败）。
        run: python scripts/check_doc_health.py
