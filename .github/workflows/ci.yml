name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # 测试与验收一律离线跑 MockBackend，不需要任何 API key
  BOTC_BACKEND: mock

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # 防止嵌套验收脚本（内部串行子进程）拖垮 CI；默认 6h 上限过宽，
    # 收紧到 25min：快速单测 + 静态检查足以在限内完成。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

      - name: Pytest
        # 排除 slow 验收包装测试（subprocess 运行完整验收脚本，单测过慢）；
        # 验收覆盖由 scripts/acceptance/*.py 与 alpha1.1 聚合脚本单独执行。
        run: pytest tests -q -m "not slow"
