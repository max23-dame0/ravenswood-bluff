[project]
name = "ravenswood-bluff"
version = "0.2.0"
description = "鸦木布拉夫小镇 — 基于多Agent的社交推理桌游系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "httpx>=0.25",
    "fastapi>=0.100.0",
    "uvicorn[standard]",
    "websockets",
    "python-dotenv",
    "aiosqlite>=0.19",
    # PLN-041：本地稀疏检索（零模型依赖，embeddings 降级兜底）
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    # >=0.5 起 [tool.ruff.lint] / [tool.ruff.format] 配置段稳定可用
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 根目录入口脚本（simulate_game.py）需可被 tests 直接 import，勿删
pythonpath = ["."]
addopts = "-q"
# slow：验收脚本包装测试，内部通过 subprocess 运行 scripts/acceptance/*.py，
# 单测会串行拉起多个子进程（实测最长 59s），CI 的 pytest 步骤默认以
# `-m "not slow"` 排除，验收由 scripts/acceptance 与 alpha1.1 聚合脚本单独执行。
markers = [
    "slow: acceptance 验收脚本包装测试（subprocess 运行完整验收流程，仅单独执行）",
]

# ---------------------------------------------------------------------------
# Ruff：lint + format 统一入口
# 命令：ruff check src tests / ruff format --check src tests
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = [
    ".venv",
    "data",
    "runtime_game_logs",
    "ref_docs",
]

[tool.ruff.lint]
# 阶段一（已收敛零告警）：E4 导入格式 / E7 语句规范 / E9 语法错误 / F pyflakes / W 空白与转义
# 阶段二（逐族启用，见 DECISIONS.md D009）：全部已启用并收敛至零告警
#   "I"   isort 导入排序      —— 71 项经 --fix 自动收敛
#   "UP"  pyupgrade           —— 133 项（Optional[X] → X | None 等）；UP042 单独豁免见下
#   "B"   flake8-bugbear      —— 22 项，B023/B904 人工修复
#   "SIM" flake8-simplify     —— 24 项，人工复核后修复
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    # 行长交由 ruff format 控制；存量长行多为中文 prompt 文案，强制换行会改变字面量
    "E501",
    # UP042: class X(str, Enum) → StrEnum 会改变 str(X.A) 结果（"X.A" → "A"），
    # 项目多处日志/序列化依赖该行为，禁止自动 --fix
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# 共享 fixture / 替身聚合模块：再导出供各测试 import，非死代码（见 DECISIONS.md D008）
"tests/conftest.py" = ["F401"]
"tests/__init__.py" = ["F401"]
"src/**/__init__.py" = ["F401"]
# 延迟导入是刻意的：必须在 sys.modules 注入假 numpy/faiss 之后才能 import vector_memory（见文件内说明）
"tests/test_agents/test_vector_memory.py" = ["E402"]
# 独立执行的脚本统一采用 `sys.path.insert(REPO_ROOT)` 引导后再 import src.*，
# 该 bootstrap 必须先于业务 import 执行，E402 在此为预期模式而非缺陷。
"scripts/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
